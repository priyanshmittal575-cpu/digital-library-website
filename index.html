<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSE Digital Library & Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>CSE Open Digital Library</h1>
      <p>Curated lecture notes, lab manuals, and reference e-books for B.Tech students</p>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search notes, manuals, or books..." />
      <div id="subjectFilters" class="subject-pills">
        <button class="active" data-sub="All">All Subjects</button>
        <button data-sub="C Programming">C Programming</button>
        <button data-sub="Web Tech">Web Tech</button>
        <button data-sub="Math">Engineering Math</button>
        <button data-sub="Physics">Applied Physics</button>
      </div>
    </div>

    <div id="resourceGrid" class="resource-grid"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
